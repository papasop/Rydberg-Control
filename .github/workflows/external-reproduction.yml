name: External reproduction

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  tests-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock-python312.txt
      - name: Install locked external reproduction dependencies
        run: python -m pip install -r requirements-lock-python312.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Strict preflight
        run: python reproduce.py --preflight --strict-environment

  full-reproduction:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock-python312.txt
      - name: Install locked external reproduction dependencies
        run: python -m pip install -r requirements-lock-python312.txt
      - name: Full external reproduction
        run: python reproduce.py --protocol all --strict-environment
      - name: Upload external reproduction run
        uses: actions/upload-artifact@v4
        with:
          name: external-runs
          path: external_runs/
